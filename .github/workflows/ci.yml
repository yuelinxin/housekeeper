name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora:
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test environment
        run: podman build --build-arg FEDORA_VERSION=${{ matrix.fedora }} -t housekeeper-test -f tests/Containerfile .
      - name: Create clean source archive
        run: python3 build-aux/source_archive.py dist/housekeeper-0.1.0.tar.gz
      - name: Build, exercise GTK, and test RPM packaging
        run: |
          mkdir -p artifacts
          podman run --rm --network none \
            -v "$PWD:/source:ro" -v "$PWD/artifacts:/artifacts" \
            housekeeper-test bash /source/build-aux/container_check.sh
      - name: Test real isolated package transactions
        run: |
          podman run --rm --network none -v "$PWD:/source:ro" -w /source \
            -e HOUSEKEEPER_DISPOSABLE_TEST=1 \
            housekeeper-test python3 tests/integration_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-${{ matrix.fedora }}-packages
          path: artifacts/*.rpm
          if-no-files-found: error

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ruff mypy
      - run: ruff check src tests build-aux
      - run: ruff format --check src tests build-aux
      - run: mypy

  runtime-floor:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install a conservative GTK runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-gi python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 \
            meson ninja-build libglib2.0-dev gettext desktop-file-utils \
            xvfb xauth dbus-daemon libgtk-4-bin
      - name: Build and test without optional providers
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          PYTHONPATH=src /usr/bin/python3 -m pytest -q
          GTK_A11Y=none GIO_USE_VFS=local GSK_RENDERER=cairo \
            xvfb-run -a dbus-run-session --config-file=tests/session.conf -- \
            /usr/bin/python3 tests/smoke_ui.py
