name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora:
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44, 45]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test environment
        run: podman build --build-arg FEDORA_VERSION=${{ matrix.fedora }} -t housekeeper-test -f tests/Containerfile .
      - name: Create clean source archive
        run: python3 build-aux/source_archive.py
      - name: Build, exercise GTK, and test RPM packaging
        run: |
          mkdir -p artifacts
          podman run --rm --network none \
            -v "$PWD:/source:ro" -v "$PWD/artifacts:/artifacts" \
            housekeeper-test bash /source/build-aux/container_check.sh
      - name: Test real isolated package transactions
        run: |
          podman run --rm --network none -v "$PWD:/source:ro" -w /source \
            -e HOUSEKEEPER_DISPOSABLE_TEST=1 \
            housekeeper-test python3 tests/integration_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-${{ matrix.fedora }}-packages
          path: artifacts/*.rpm
          if-no-files-found: error

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ruff mypy
      - run: ruff check src tests build-aux
      - run: ruff format --check src tests build-aux
      - run: mypy

  debian-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            target: ubuntu24.04
          - image: debian:13
            target: debian13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distribution test environment
        run: podman build --target build --build-arg BASE_IMAGE=docker.io/library/${{ matrix.image }} -t housekeeper-deb-test -f tests/Containerfile.debian .
      - name: Build and validate native package
        run: |
          python3 build-aux/source_archive.py
          mkdir -p artifacts
          podman run --rm --network none \
            -v "$PWD:/source:ro" -v "$PWD/artifacts:/artifacts" \
            housekeeper-deb-test bash /source/build-aux/debian_check.sh
      - name: Test signed APT installation and denied authorization
        run: |
          for mode in allow deny; do
            podman run --rm --network none -v "$PWD:/source:ro" \
              -e HOUSEKEEPER_DISPOSABLE_TEST=1 -e PYTHONPATH=/source/src \
              housekeeper-deb-test python3 /source/tests/integration_deb_install.py "$mode"
          done
      - name: Validate runtime without recommended integrations
        run: |
          podman build --target runtime --build-arg BASE_IMAGE=docker.io/library/${{ matrix.image }} -t housekeeper-deb-runtime -f tests/Containerfile.debian .
          podman run --rm --network none housekeeper-deb-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-packages
          path: artifacts/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current Arch environment
        run: podman build --target build -t housekeeper-arch-test -f tests/Containerfile.arch .
      - name: Build and validate pacman package
        run: |
          python3 build-aux/source_archive.py
          mkdir -p artifacts
          podman run --rm --init --network none \
            -v "$PWD:/source:ro" -v "$PWD/artifacts:/artifacts" \
            housekeeper-arch-test bash /source/build-aux/arch_check.sh
      - name: Verify ALPM transaction scope and external installation guidance
        run: |
          podman run --rm --init --network none -v "$PWD:/source:ro" \
            -e HOUSEKEEPER_DISPOSABLE_TEST=1 -e PYTHONPATH=/source/src \
            housekeeper-arch-test python /source/tests/integration_arch_install.py
      - name: Validate runtime without optional integrations
        run: |
          podman build --target runtime -t housekeeper-arch-runtime -f tests/Containerfile.arch .
          podman run --rm --init --network none housekeeper-arch-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: artifacts/*
          if-no-files-found: error

  runtime-floor:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install a conservative GTK runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-gi python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 \
            meson ninja-build libglib2.0-dev gettext desktop-file-utils \
            xvfb xauth dbus-daemon libgtk-4-bin
      - name: Build and test without optional providers
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          PYTHONPATH=src /usr/bin/python3 -m pytest -q
          GTK_A11Y=none GIO_USE_VFS=local GSK_RENDERER=cairo \
            xvfb-run -a dbus-run-session --config-file=tests/session.conf -- \
            /usr/bin/python3 tests/smoke_ui.py
          GTK_A11Y=none GIO_USE_VFS=local GSK_RENDERER=cairo \
            xvfb-run -a dbus-run-session --config-file=tests/session.conf -- \
            /usr/bin/python3 tests/stress_icons.py --runs 5
